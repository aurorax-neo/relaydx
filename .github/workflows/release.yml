name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install static build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools binutils

      - name: Make release script executable
        run: chmod +x scripts/release.sh

      - name: Verify version.txt
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          expected="$(tr -d '[:space:]' < version.txt)"
          if [ "$EVENT_NAME" = push ]; then
            actual="${EVENT_TAG#v}"
          else
            actual="${INPUT_TAG#v}"
          fi
          test "$actual" = "$expected"

      - name: Build and package
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            tag="${EVENT_TAG#v}"
          else
            tag="${INPUT_TAG#v}"
          fi
          ./scripts/release.sh "$tag" "$ARCH"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relaydx-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          expected="$(tr -d '[:space:]' < version.txt)"
          if [ "$EVENT_NAME" = push ]; then
            actual="${EVENT_TAG#v}"
          else
            actual="${INPUT_TAG#v}"
          fi
          test "$actual" = "$expected"

      - name: Verify checksums
        working-directory: dist
        run: |
          sha256sum --check -- *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: relaydx ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist/*
