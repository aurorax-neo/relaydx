name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version and check existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = push ]; then
            tag="$EVENT_TAG"
          else
            tag="$INPUT_TAG"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          version="${tag#v}"
          expected="$(tr -d '[:space:]' < version.txt)"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [ "$version" != "$expected" ]; then
            echo "Tag $tag does not match version.txt ($expected)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping build and publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install static build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake musl-tools binutils

      - name: Build static binary
        run: |
          set -eu
          multiarch="$(musl-gcc -print-multiarch)"
          uapi="$RUNNER_TEMP/linux-uapi"
          mkdir -p "$uapi"
          ln -s /usr/include/linux "$uapi/linux"
          ln -s /usr/include/asm-generic "$uapi/asm-generic"
          ln -s "/usr/include/$multiarch/asm" "$uapi/asm"
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_C_FLAGS="-isystem $uapi" \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DRELAYDX_NETWORK_TESTING=OFF
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure
          strip --strip-unneeded build-release/relaydx
          if readelf -l build-release/relaydx | grep -q ' INTERP '; then
            echo 'Release binary has a dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d build-release/relaydx | grep -q '(NEEDED)'; then
            echo 'Release binary has dynamic dependencies' >&2
            exit 1
          fi

      - name: Create release archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          package="relaydx-v${VERSION}-${TARGET}"
          mkdir -p "dist/$package"
          install -m 0755 build-release/relaydx "dist/$package/relaydx"
          install -m 0755 scripts/install.sh "dist/$package/install.sh"
          install -m 0755 scripts/uninstall.sh "dist/$package/uninstall.sh"
          install -m 0755 scripts/update.sh "dist/$package/update.sh"
          install -m 0644 contrib/relaydx.service "dist/$package/relaydx.service"
          install -m 0644 contrib/relaydx.default "dist/$package/relaydx.default"
          install -m 0644 version.txt LICENSE README.md README.zh.md \
            THIRD_PARTY_NOTICES.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -rf "dist/$package"
          cd dist
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relaydx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, package]
    if: needs.prepare.outputs.skip != 'true' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check -- *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: relaydx ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*
