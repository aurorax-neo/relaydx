name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      run_network_tests:
        description: "运行特权 Linux 网络命名空间端到端测试"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, Sanitizers & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-ci-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ccache-ci-

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ccache

      - name: Build, verify dynamic deps & run unit tests
        shell: bash
        run: |
          set -euo pipefail
          unset RELAYDX_GITHUB_MIRROR
          export CCACHE_DIR="$HOME/.cache/ccache"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ! ldd build/relaydx | grep -E 'libubox|libresolv|json-c'

      - name: Build & test with ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          unset RELAYDX_GITHUB_MIRROR
          export CCACHE_DIR="$HOME/.cache/ccache"

          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure

  network:
    name: Privileged Network Namespace Tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_network_tests == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure, build & run network tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DRELAYDX_NETWORK_TESTING=ON
          cmake --build build --parallel
          sudo ctest --test-dir build --output-on-failure
