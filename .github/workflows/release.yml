name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号 (例如 v0.1.5)"
        required: true
        default: "v0.1.5"
      force_build:
        description: "强制云端重新编译打包（默认优先复用已上传的本地制品以节省额度）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 阶段 0: 1x 极速前置守门员 + 本地已上传制品短路判定
  validate-release:
    name: Validate Release & Gate Quota
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      body: ${{ steps.changelog.outputs.body }}
      needs_build: ${{ steps.gate.outputs.needs_build }}
    steps:
      - name: Checkout target tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tag format (SemVer)
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' 不符合 SemVer（应为 vX.Y.Z 或 vX.Y.Z-pre）"
            exit 1
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify source version matches Tag
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          SRC_VER="$(tr -d '[:space:]' < version.txt)"
          if [ "$SRC_VER" != "$VER" ]; then
            echo "::error::version.txt ($SRC_VER) 与 Tag ($VER) 不一致"
            exit 1
          fi

      - name: Verify & extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.meta.outputs.version }}"
          ESCAPED_VER="$(printf '%s' "$VER" | sed 's/[.[\*^$()+?{|]/\\&/g')"
          if ! grep -qE "^##[[:space:]]*(\[${ESCAPED_VER}\]|${ESCAPED_VER})([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少版本 $VER 的条目，请先补充后重推 Tag"
            exit 1
          fi
          BODY="$(awk -v ver="$VER" '
            /^##[[:space:]]/ {
              if (flag) exit
              line = $0
              sub(/^##[[:space:]]*/, "", line)
              if (index(line, "[" ver "]") == 1 || line == ver || index(line, ver " ") == 1 || index(line, ver "\t") == 1) {
                flag = 1
                next
              }
            }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md 中版本 $VER 内容为空"
            exit 1
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            echo "$BODY"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$BODY" > RELEASE_BODY.md

      - name: Check pre-uploaded release assets
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          FORCE="${{ inputs.force_build || false }}"
          EXPECTED_ASSETS=(
            "relaydx-${TAG}-x86_64-unknown-linux-musl.tar.gz"
            "relaydx-${TAG}-aarch64-unknown-linux-musl.tar.gz"
          )

          EXISTING="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          ALL_PRESENT=true
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -qxF "$asset" <<< "$EXISTING"; then
              ALL_PRESENT=false
              break
            fi
          done

          if [ "$FORCE" != "true" ] && [ "$ALL_PRESENT" = "true" ]; then
            echo "检测到 $TAG 全量制品已存在，直接同步 CHANGELOG Release Notes，跳过云端编译以节省额度"
            gh release edit "$TAG" \
              --title "relaydx $TAG" \
              --notes-file RELEASE_BODY.md \
              --prerelease="${{ steps.meta.outputs.prerelease }}"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  # 阶段 1: 多架构 Linux musl 纯静态二进制编译打包（纯 Linux 守护进程，剔除 macOS/Windows）
  build-binaries:
    name: Build Binaries (${{ matrix.label }})
    needs: validate-release
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout target tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Remove local mirror overrides in CI
        shell: bash
        run: |
          unset RELAYDX_GITHUB_MIRROR
          rm -f .npmrc

      - name: Cache ccache objects
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Install static musl toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache musl-tools binutils

      - name: Build, verify & package static binary
        shell: bash
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          unset RELAYDX_GITHUB_MIRROR
          export CCACHE_DIR="$HOME/.cache/ccache"

          multiarch="$(musl-gcc -print-multiarch)"
          uapi="$RUNNER_TEMP/linux-uapi"
          mkdir -p "$uapi"
          ln -sfn /usr/include/linux "$uapi/linux"
          ln -sfn /usr/include/asm-generic "$uapi/asm-generic"
          ln -sfn "/usr/include/$multiarch/asm" "$uapi/asm"

          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-isystem $uapi" \
            -DCMAKE_EXE_LINKER_FLAGS=-static \
            -DRELAYDX_NETWORK_TESTING=OFF
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure
          strip --strip-unneeded build-release/relaydx

          if readelf -l build-release/relaydx | grep -q ' INTERP '; then
            echo "::error::Release binary has a dynamic interpreter"
            exit 1
          fi
          if readelf -d build-release/relaydx | grep -q '(NEEDED)'; then
            echo "::error::Release binary has dynamic dependencies"
            exit 1
          fi

          pkg_name="relaydx-${TAG}-${TARGET}"
          stage_dir="stage-${TARGET}/${pkg_name}"
          mkdir -p "$stage_dir" release-packages
          install -m 0755 build-release/relaydx "$stage_dir/relaydx"
          install -m 0755 scripts/install.sh "$stage_dir/install.sh"
          install -m 0755 scripts/uninstall.sh "$stage_dir/uninstall.sh"
          install -m 0755 scripts/update.sh "$stage_dir/update.sh"
          install -m 0644 contrib/relaydx.service "$stage_dir/relaydx.service"
          install -m 0644 contrib/relaydx.default "$stage_dir/relaydx.default"
          install -m 0644 version.txt CHANGELOG.md LICENSE README.md \
            README.zh.md THIRD_PARTY_NOTICES.md "$stage_dir/"

          tar -C "stage-${TARGET}" -czf "release-packages/${pkg_name}.tar.gz" "$pkg_name"
          (
            cd release-packages
            sha256sum "${pkg_name}.tar.gz" > "${pkg_name}.tar.gz.sha256"
          )

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.label }}
          path: release-packages/*
          if-no-files-found: error
          retention-days: 1

  # 阶段 2: 汇总发布 GitHub Release 压缩包与 SHA256 校验和
  publish-release:
    name: Publish GitHub Release Assets
    needs: [validate-release, build-binaries]
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: Verify & generate SHA256 checksums
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --check -- *.sha256
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: relaydx ${{ needs.validate-release.outputs.tag }}
          body: ${{ needs.validate-release.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}

  # 阶段 3: 零 QEMU 秒级发布多架构 Docker 镜像至 GHCR
  docker:
    name: Publish Multi-arch Docker Image to GHCR
    needs: [validate-release, build-binaries]
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Dockerfile.release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download Linux amd64 & arm64 packages
        uses: actions/download-artifact@v8
        with:
          path: linux-pkgs
          pattern: package-linux-*
          merge-multiple: true

      - name: Unpack multi-arch static binaries
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.validate-release.outputs.tag }}"
          mkdir -p docker-bin/amd64 docker-bin/arm64
          tar -xzf "linux-pkgs/relaydx-${TAG}-x86_64-unknown-linux-musl.tar.gz" \
            --strip-components=1 -C docker-bin/amd64 \
            "relaydx-${TAG}-x86_64-unknown-linux-musl/relaydx"
          tar -xzf "linux-pkgs/relaydx-${TAG}-aarch64-unknown-linux-musl.tar.gz" \
            --strip-components=1 -C docker-bin/arm64 \
            "relaydx-${TAG}-aarch64-unknown-linux-musl/relaydx"
          chmod 0755 docker-bin/amd64/relaydx docker-bin/arm64/relaydx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/relaydx
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.validate-release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ needs.validate-release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.prerelease != 'true' }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify & record image digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::未获取到多架构镜像 Digest，阻断静默异常发布"
            exit 1
          fi
          {
            echo "### 📦 Multi-arch Docker Image Published"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/relaydx:${{ needs.validate-release.outputs.tag }}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
